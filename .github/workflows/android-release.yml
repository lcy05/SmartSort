name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "未找到预装 Android SDK：$sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # 只补齐缺失的编译依赖，不重装 SDK，避免依赖已下架的 legacy tools 包。
          missing=""
          [ -d "$sdk/platforms/android-34" ] || missing="$missing platforms;android-34"
          [ -d "$sdk/build-tools/34.0.0" ] || missing="$missing build-tools;34.0.0"
          if [ -n "$missing" ]; then
            echo "补装：$missing"
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install $missing > /dev/null
          fi
          echo "platforms: $(ls "$sdk/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$sdk/build-tools" | tr '\n' ' ')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag against versionName
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)"
          echo "tag=${tag} versionName=${version}"
          if [ "$tag" != "$version" ]; then
            echo "tag 与 versionName 不一致，终止发布" >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SMARTSORT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少密钥 Secrets：SMARTSORT_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartsort-release.jks"

      - name: Build signed release
        env:
          SMARTSORT_REQUIRE_SIGNED: "true"
          SMARTSORT_KEYSTORE_FILE: ${{ runner.temp }}/smartsort-release.jks
          SMARTSORT_KEYSTORE_PASSWORD: ${{ secrets.SMARTSORT_KEYSTORE_PASSWORD }}
          SMARTSORT_KEY_ALIAS: ${{ secrets.SMARTSORT_KEY_ALIAS }}
          SMARTSORT_KEY_PASSWORD: ${{ secrets.SMARTSORT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signing and prepare assets
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/SmartSort-v${APP_VERSION}.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "Android SDK 路径未设置，无法校验签名" >&2
            exit 1
          fi
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -1)"
          if [ -z "$signer" ]; then
            echo "未找到 apksigner" >&2
            exit 1
          fi
          "$signer" verify --verbose "$apk"
          asset="SmartSort-v${APP_VERSION}.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "ASSET_NAME=${asset}" >> "$GITHUB_ENV"
          ls -lh "$asset" "${asset}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SmartSort v${{ env.APP_VERSION }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
