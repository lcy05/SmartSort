name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "未找到预装 Android SDK：$sdk" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # 只补齐缺失的编译依赖，不重装 SDK，避免依赖已下架的 legacy tools 包。
          missing=""
          [ -d "$sdk/platforms/android-34" ] || missing="$missing platforms;android-34"
          [ -d "$sdk/build-tools/34.0.0" ] || missing="$missing build-tools;34.0.0"
          if [ -n "$missing" ]; then
            echo "补装：$missing"
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install $missing > /dev/null
          fi
          echo "platforms: $(ls "$sdk/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$sdk/build-tools" | tr '\n' ' ')"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSort-verification
          path: app/build/outputs/apk/release/SmartSort-v*.apk
          if-no-files-found: error
